# Runs the same checks required before every commit (see CLAUDE.md) on each
# push and pull request, so a broken build is caught before Vercel deploys it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # No secrets needed: pages load their data in the browser, so the build
      # never connects to the database or Gemini.
      - run: npm run build
